name: CI

# Independent gate for main: the full local suite (stdlib only,
# no secrets, no network) must pass on every push and pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Unit tests
        run: python3 -m pytest tests -q
      - name: Analysis-library self checks
        run: python3 Source/self_check.py
