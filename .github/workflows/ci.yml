name: CI

# Independent gate for main: dependency install, the backend gates
# (ruff, pytest, unittest, self-check) and the frontend gates
# (pnpm install, typecheck, vitest, production build, Playwright E2E
# against a seeded backend) must pass on every push and pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks scans commit history; a shallow checkout leaves
          # the parent commits it diffs against missing, failing the
          # step with zero history scanned.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --require-hashes -r requirements.lock
      - name: Backend lint (Ruff, Nextly-aligned config)
        run: ruff check Backend tests Source
      - name: Pytest suite (FastAPI + SQLAlchemy + httpx)
        run: python3 -m pytest tests/ -q
      - name: Legacy unittest runner
        run: python3 -m unittest discover -s tests
      - name: Package build/install (Oracle installer runs pip install .)
        run: python3 -m pip install --no-deps .
      - name: Deployment migration command (twice, like install then update)
        run: |
          export CREATIVE_INTEL_DB_URL="sqlite:///${RUNNER_TEMP}/ci-mig.db"
          python3 -m alembic -c Backend/alembic.ini upgrade head
          python3 -m alembic -c Backend/alembic.ini upgrade head
          python3 -c "import sqlite3;db=sqlite3.connect('${RUNNER_TEMP}/ci-mig.db');v=db.execute('SELECT version_num FROM alembic_version').fetchall();assert v==[('0009',)],v;print('head:',v)"
      - name: Analysis-library self checks
        run: python3 Source/self_check.py
      - name: Python vulnerability audit
        run: |
          python3 -m pip install pip-audit
          python3 -m pip_audit -r requirements.lock
      - name: Shellcheck Oracle scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning deploy/oracle/*.sh
      - name: Secret scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
      - name: Static security scan (Semgrep OSS)
        # Private-repo SAST: CodeQL needs GitHub Advanced Security, so
        # Semgrep OSS (no token, registry rules) is the always-on gate.
        # --severity ERROR keeps audit-tier notes advisory; only real
        # findings fail the build.
        run: |
          python3 -m pip install semgrep
          semgrep scan --config p/security-audit --severity ERROR --error \
            --exclude node_modules --exclude dist \
            Backend apps/creative-intelligence-ui/src

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies (E2E server)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --require-hashes -r requirements.lock
      - name: Install pnpm (Nextly packageManager strategy)
        run: corepack enable && corepack prepare pnpm@10.14.0 --activate
      - name: Install frontend dependencies
        run: pnpm --dir apps/creative-intelligence-ui install --frozen-lockfile
      - name: JavaScript dependency audit
        run: pnpm --dir apps/creative-intelligence-ui audit --audit-level high
      - name: Frontend typecheck
        run: pnpm --dir apps/creative-intelligence-ui typecheck
      - name: Vitest suite
        run: pnpm --dir apps/creative-intelligence-ui test
      - name: Frontend production build
        run: pnpm --dir apps/creative-intelligence-ui build
      - name: Install Playwright Chromium
        run: pnpm --dir apps/creative-intelligence-ui exec playwright install chromium --with-deps
      - name: Playwright E2E (seeded backend + production build)
        run: pnpm --dir apps/creative-intelligence-ui test:e2e
      - name: Upload screen captures (visual review artifact)
        # Side-by-side review gate against the 14 approved references
        # (see docs/Visual Review.md). Always uploads, even when the
        # E2E step fails, so a red run still yields reviewable shots.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-screens
          path: apps/creative-intelligence-ui/test-results/screens/
          if-no-files-found: warn

  full-demo:
    # Populated-demo visual suite: the 02-full-demo specs seed the ten
    # synthetic campaigns/creatives/artwork on top of the small fixture
    # (FULL_DEMO=1) and capture every reference screen with real content.
    # Separate from the frontend job so the small-fixture suite keeps its
    # deterministic dataset.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies (E2E server)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --require-hashes -r requirements.lock
      - name: Install pnpm (Nextly packageManager strategy)
        run: corepack enable && corepack prepare pnpm@10.14.0 --activate
      - name: Install frontend dependencies
        run: pnpm --dir apps/creative-intelligence-ui install --frozen-lockfile
      - name: Frontend production build
        run: pnpm --dir apps/creative-intelligence-ui build
      - name: Install Playwright Chromium
        run: pnpm --dir apps/creative-intelligence-ui exec playwright install chromium --with-deps
      - name: Playwright full-demo suite (populated ten-example dataset)
        run: pnpm --dir apps/creative-intelligence-ui exec playwright test e2e/02-full-demo.spec.ts
        env:
          FULL_DEMO: "1"
      - name: Upload populated captures (visual review artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: populated-screens
          path: apps/creative-intelligence-ui/test-results/screens/
          if-no-files-found: warn
