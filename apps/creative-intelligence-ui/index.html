<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Creative Intelligence</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      /* Pre-render theme (§5): apply before first paint so dark-mode
       * users never see a light flash — login included. Mirrors
       * useTheme precedence: explicit saved choice wins, otherwise
       * light. Storage failures fall through to light. */
      try {
        var m = window.localStorage.getItem("ci-theme");
        var dark = false;
        if (m === "dark") dark = true;
        else if (m === "system" && window.matchMedia) {
          dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        }
        if (dark) document.documentElement.dataset["theme"] = "dark";
      } catch (e) {
        /* no stored choice readable: stay on the light default */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
