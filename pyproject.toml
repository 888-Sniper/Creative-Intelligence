[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "creative-intelligence"
version = "0.1.0"
description = "Foap Creative Intelligence — local ad-creative analytics"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "httpx>=0.28",
  "python-multipart>=0.0.12",
  "keyring>=25.0",
  "cryptography>=44",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff==0.16.6",
]

# A10: explicit discovery — the repo root holds many non-package
# directories (deploy, docs, Data, ...), so setuptools flat-layout
# autodiscovery refuses to guess. The importable packages live in
# Backend/ and are imported as top-level ci_backend / creative_intel.
[tool.setuptools.packages.find]
where = ["Backend"]
include = ["ci_backend*", "creative_intel*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # Third-party import-time notice (fastapi/testclient.py re-export);
    # not our code and not a resource leak. Everything else still shows.
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
