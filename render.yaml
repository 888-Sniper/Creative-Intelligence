# Render Free demo deployment (additive: Oracle support untouched).
#
# Connect this repo in the Render dashboard (New + -> Blueprint, point
# at this file) or create the Web Service manually from the Docker
# settings below. Deploys from main; every push to main redeploys.
services:
  - type: web
    name: creative-intelligence
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      # Public demo posture (fail-closed via require_public_safety()).
      - key: CREATIVE_INTEL_ENVIRONMENT
        value: demo
      - key: CREATIVE_INTEL_COOKIE_SECURE
        value: "true"
      - key: CREATIVE_INTEL_PROVIDER_MODE
        value: live
      # Ephemeral demo storage; sample data is added ONLY through
      # Admin -> Advanced -> Demo Data -> Add Demo Data Once (one-time
      # pack with a persistent receipt). Boot-time seeding is retired
      # because it could resurrect deliberately deleted samples.
      - key: CREATIVE_INTEL_DATA_DIR
        value: /app/data
      - key: CREATIVE_INTEL_DEMO_SEED
        value: "false"
      # Recreate code-seeded staff admins on every boot: the Free plan
      # has no persistent disk, so the sqlite file (and any admin added
      # through the UI) is wiped on each redeploy. Retire this when a
      # persistent disk lands.
      - key: CREATIVE_INTEL_SEED_ADMINS
        value: "true"
      # Analysis worker: the web process runs the queue worker
      # in-process (see CREATIVE_INTEL_RUN_WORKER below), so this
      # single-service blueprint analyses end to end with no second
      # service. On a paid plan, prefer a dedicated Background Worker
      # service (same Docker image, start command
      # `python Backend/ci_backend/worker.py`) and set
      # CREATIVE_INTEL_RUN_WORKER=false here so jobs are not
      # double-claimed (claiming is lease-fenced, but one worker is
      # cleaner). Oracle keeps its systemd worker unit unchanged.
      - key: CREATIVE_INTEL_RUN_WORKER
        value: "true"
      # Secrets below are placeholders: fill them in the Render
      # dashboard AFTER creating the service (never commit values).
      # The service stays unhealthy until the required ones are set.
      - key: CREATIVE_INTEL_ADMIN_EMAIL
        sync: false
      - key: CREATIVE_INTEL_WORKOS_CLIENT_ID
        sync: false
      - key: CREATIVE_INTEL_KEY_WORKOS
        sync: false
      - key: CREATIVE_INTEL_WORKOS_REDIRECT_URI
        sync: false
      - key: CREATIVE_INTEL_MASTER_KEY
        sync: false
      - key: CREATIVE_INTEL_GOOGLE_CLIENT_ID
        sync: false
      - key: CREATIVE_INTEL_GOOGLE_CLIENT_SECRET
        sync: false
      - key: CREATIVE_INTEL_GOOGLE_REDIRECT_URI
        sync: false
